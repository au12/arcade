<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <radialGradient id="felt" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0" stop-color="#7b1c23"/>
      <stop offset="0.65" stop-color="#4c0f15"/>
      <stop offset="1" stop-color="#22090b"/>
    </radialGradient>
    <pattern id="backRed" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#c5202a"/><rect width="6" height="12" fill="#a8161f"/>
    </pattern>
    <pattern id="backBlue" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#1c4a96"/><rect width="6" height="12" fill="#163b7a"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
    <g id="pip"><path d="M0 -12 C6 -4 14 0 14 7 C14 13 8 15 3 12 L5 20 L-5 20 L-3 12 C-8 15 -14 13 -14 7 C-14 0 -6 -4 0 -12 Z"/></g>
  </defs>
  <rect width="640" height="400" fill="url(#felt)"/>
  <ellipse cx="320" cy="214" rx="300" ry="170" fill="none" stroke="#e9c46a" stroke-opacity="0.25" stroke-width="3"/>
  <!-- the pile flying off -->
  <g opacity="0.85" stroke="#f3eadb" stroke-width="5" stroke-linecap="round">
    <path d="M400 150 L556 112" opacity="0.5"/><path d="M410 186 L590 170" opacity="0.6"/><path d="M404 222 L572 232" opacity="0.5"/>
  </g>
  <g filter="url(#shadow)">
    <g transform="translate(470 120) rotate(28)"><rect x="-44" y="-62" width="88" height="124" rx="9" fill="url(#backBlue)" stroke="#fffdf8" stroke-width="5"/></g>
    <g transform="translate(520 176) rotate(48)"><rect x="-44" y="-62" width="88" height="124" rx="9" fill="url(#backRed)" stroke="#fffdf8" stroke-width="5"/></g>
    <g transform="translate(488 238) rotate(64)"><rect x="-44" y="-62" width="88" height="124" rx="9" fill="url(#backBlue)" stroke="#fffdf8" stroke-width="5"/></g>
  </g>
  <!-- your hand -->
  <g filter="url(#shadow)">
    <g transform="translate(150 250) rotate(-16)"><rect x="-56" y="-80" width="112" height="160" rx="11" fill="#fffdf8" stroke="#2b2221" stroke-width="3"/>
      <text x="-40" y="-46" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#1c4a96">7</text>
      <use href="#pip" fill="#1c4a96" transform="translate(0 6) scale(1.6)"/></g>
    <g transform="translate(220 232) rotate(-4)"><rect x="-56" y="-80" width="112" height="160" rx="11" fill="#fffdf8" stroke="#2b2221" stroke-width="3"/>
      <text x="-40" y="-46" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#c5202a">4</text>
      <path d="M0 -12 L16 6 L0 24 L-16 6 Z" fill="#c5202a" transform="translate(0 -2) scale(1.4)"/></g>
  </g>
  <!-- the ten that swipes it -->
  <g filter="url(#shadow)" transform="translate(326 200) rotate(9)">
    <rect x="-66" y="-94" width="132" height="188" rx="13" fill="#fffdf8" stroke="#2b2221" stroke-width="3"/>
    <text x="-50" y="-56" font-family="Georgia, serif" font-weight="700" font-size="34" fill="#2b2221">10</text>
    <use href="#pip" fill="#2b2221" transform="translate(-26 -14) scale(0.95)"/><use href="#pip" fill="#2b2221" transform="translate(26 -14) scale(0.95)"/>
    <use href="#pip" fill="#2b2221" transform="translate(0 6) scale(0.95)"/>
    <use href="#pip" fill="#2b2221" transform="translate(-26 26) scale(0.95)"/><use href="#pip" fill="#2b2221" transform="translate(26 26) scale(0.95)"/>
    <use href="#pip" fill="#2b2221" transform="translate(-26 58) scale(0.95)"/><use href="#pip" fill="#2b2221" transform="translate(26 58) scale(0.95)"/>
  </g>
  <g fill="#ffd23f">
    <path d="M572 64 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
    <path d="M86 86 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" opacity="0.8"/>
  </g>
</svg>
