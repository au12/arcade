<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <radialGradient id="paper" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#f1e2b8"/>
      <stop offset="0.7" stop-color="#d9bd84"/>
      <stop offset="1" stop-color="#8a6a3a"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9772e"/>
      <stop offset="1" stop-color="#6e3f16"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6512"/>
      <stop offset="0.45" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#9a7414"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.32" cy="0.28" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#paper)"/>
  <!-- sepia sketches: gears and notes -->
  <g fill="none" stroke="#7a5a2c" stroke-width="2" opacity="0.5">
