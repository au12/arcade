    <path d="M470 196 L180 252 L180 270 L470 214 Z" fill="url(#wood)"/>
    <path d="M180 280 L452 336 L452 354 L180 298 Z" fill="url(#wood)"/>
    <rect x="452" y="330" width="22" height="70" fill="#8a5a24"/>
    <rect x="476" y="330" width="22" height="70" fill="#8a5a24"/>
    <rect x="500" y="330" width="22" height="70" fill="#8a5a24"/>
  </g>
  <!-- switch -->
  <circle cx="470" cy="190" r="12" fill="url(#brass)" stroke="#3b2a12" stroke-width="4"/>
  <path d="M470 190 L496 176" stroke="#3b2a12" stroke-width="6" stroke-linecap="round"/>
  <!-- the marbles -->
  <g stroke="#2b1d0e" stroke-width="3">
    <circle cx="320" cy="72" r="15" fill="#3b86d6"/>
    <circle cx="420" cy="140" r="17" fill="#d6463b"/>
    <circle cx="300" cy="226" r="17" fill="#e7b928"/>
    <circle cx="230" cy="262" r="17" fill="#3aa35c"/>
    <circle cx="386" cy="306" r="17" fill="#3b86d6"/>
    <circle cx="463" cy="370" r="10" fill="#d6463b"/>
    <circle cx="487" cy="370" r="10" fill="#d6463b"/>
    <circle cx="511" cy="378" r="10" fill="#3b86d6"/>
  </g>
  <g>
    <circle cx="320" cy="72" r="15" fill="url(#shine)"/>
    <circle cx="420" cy="140" r="17" fill="url(#shine)"/>
    <circle cx="300" cy="226" r="17" fill="url(#shine)"/>
    <circle cx="230" cy="262" r="17" fill="url(#shine)"/>
    <circle cx="386" cy="306" r="17" fill="url(#shine)"/>
