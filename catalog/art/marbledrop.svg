  <ellipse cx="320" cy="40" rx="72" ry="10" fill="#5a3f14" stroke="#3b2a12" stroke-width="5"/>
  <!-- the zig-zag run -->
  <g stroke="#3b2a12" stroke-width="5" stroke-linejoin="round">
