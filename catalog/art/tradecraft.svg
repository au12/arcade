<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1a22"/>
      <stop offset="1" stop-color="#071017"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e4c2" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f2e4c2" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#37c3c9" stop-opacity="0.08"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#night)"/>
  <path d="M250 0 L390 0 L560 400 L80 400 Z" fill="url(#beam)"/>
  <!-- the board, in perspective -->
  <g transform="translate(320 250)">
    <g stroke="#071017" stroke-width="3">
      <!-- back row -->
      <path d="M-190 -96 L-118 -96 L-122 -66 L-200 -66 Z" fill="#f2e4c2"/>
      <path d="M-108 -96 L-36 -96 L-38 -66 L-114 -66 Z" fill="#37c3c9"/>
      <path d="M-26 -96 L46 -96 L46 -66 L-30 -66 Z" fill="#f2e4c2"/>
      <path d="M56 -96 L128 -96 L132 -66 L56 -66 Z" fill="#e64b4b"/>
      <path d="M138 -96 L210 -96 L218 -66 L142 -66 Z" fill="#f2e4c2"/>
      <!-- second row -->
      <path d="M-204 -58 L-124 -58 L-128 -24 L-214 -24 Z" fill="#f2e4c2"/>
      <path d="M-114 -58 L-36 -58 L-38 -24 L-118 -24 Z" fill="#f2e4c2"/>
      <path d="M-26 -58 L52 -58 L52 -24 L-28 -24 Z" fill="#1b1b1b"/>
      <path d="M62 -58 L140 -58 L144 -24 L62 -24 Z" fill="#f2e4c2"/>
      <path d="M150 -58 L228 -58 L238 -24 L154 -24 Z" fill="#37c3c9"/>
      <!-- front row -->
      <path d="M-220 -14 L-132 -14 L-138 26 L-232 26 Z" fill="#37c3c9"/>
      <path d="M-120 -14 L-34 -14 L-36 26 L-126 26 Z" fill="#f2e4c2"/>
      <path d="M-22 -14 L64 -14 L64 26 L-24 26 Z" fill="#e64b4b"/>
      <path d="M76 -14 L162 -14 L168 26 L76 26 Z" fill="#f2e4c2"/>
      <path d="M174 -14 L260 -14 L272 26 L180 26 Z" fill="#f2e4c2"/>
    </g>
    <!-- word lines on the face-down cards -->
    <g stroke="#8a7b5c" stroke-width="4" stroke-linecap="round">
      <path d="M-176 -82 h36"/><path d="M-10 -82 h40"/><path d="M156 -82 h36"/>
      <path d="M-190 -42 h44"/><path d="M-100 -42 h44"/><path d="M80 -42 h44"/>
      <path d="M-104 4 h48"/><path d="M94 4 h50"/><path d="M194 4 h52"/>
    </g>
    <path d="M4 -50 l20 18 m0 -18 l-20 18" stroke="#e64b4b" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- the agent: hat and magnifier -->
  <g transform="translate(92 96) scale(0.82)">
    <path d="M-70 40 C-70 20 -40 12 0 12 C40 12 70 20 70 40 C40 48 -40 48 -70 40 Z" fill="#1d2f38" stroke="#37c3c9" stroke-width="3"/>
    <path d="M-38 16 C-36 -18 -18 -30 0 -30 C18 -30 36 -18 38 16 Z" fill="#1d2f38" stroke="#37c3c9" stroke-width="3"/>
    <path d="M-36 4 H36" stroke="#e64b4b" stroke-width="8"/>
  </g>
  <g transform="translate(540 120) rotate(-30)">
    <circle r="44" fill="url(#lens)" stroke="#f2e4c2" stroke-width="8"/>
    <rect x="-8" y="48" width="16" height="70" rx="6" fill="#8a5a24" stroke="#f2e4c2" stroke-width="3"/>
  </g>
</svg>
