<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a0f0a"/>
      <stop offset="0.55" stop-color="#c8361c"/>
      <stop offset="0.85" stop-color="#f08a24"/>
      <stop offset="1" stop-color="#f6c443"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.36" cy="0.32" r="0.75">
