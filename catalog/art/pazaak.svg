<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <radialGradient id="lamp" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#f0b43c" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#5a3a14" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0f151c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14324a"/>
      <stop offset="1" stop-color="#0a1a28"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc3ff"/><stop offset="1" stop-color="#1f6fc4"/>
    </linearGradient>
    <linearGradient id="cardRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a7a"/><stop offset="1" stop-color="#c42f3a"/>
    </linearGradient>
    <linearGradient id="cardGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#c98a12"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="400" fill="#0f151c"/>
  <rect width="640" height="400" fill="url(#lamp)"/>
  <!-- the lamp -->
  <path d="M290 0 L350 0 L372 30 L268 30 Z" fill="#2b2f36"/>
  <ellipse cx="320" cy="30" rx="54" ry="7" fill="#ffd27a"/>
  <!-- the holotable -->
  <path d="M60 400 L170 210 L470 210 L580 400 Z" fill="url(#table)"/>
  <g stroke="#3ea6ff" stroke-width="2" opacity="0.5" filter="url(#glow)">
    <path d="M170 210 L470 210"/><path d="M146 252 L494 252"/><path d="M118 300 L522 300"/><path d="M86 356 L554 356"/>
    <path d="M220 210 L160 400"/><path d="M270 210 L250 400"/><path d="M320 210 L320 400"/><path d="M370 210 L390 400"/><path d="M420 210 L480 400"/>
  </g>
  <path d="M60 400 L170 210 L470 210 L580 400" fill="none" stroke="#7fd3ff" stroke-width="3" opacity="0.8" filter="url(#glow)"/>
  <!-- cards hovering over the table -->
  <g font-family="Verdana, sans-serif" font-weight="700" text-anchor="middle" stroke="#0a1018" stroke-width="3">
    <g transform="translate(196 172) rotate(-10)">
      <rect x="-40" y="-58" width="80" height="116" rx="10" fill="url(#cardBlue)"/>
      <text y="14" font-size="40" fill="#0a1018" stroke="none">+3</text>
    </g>
    <g transform="translate(320 150)">
      <rect x="-46" y="-66" width="92" height="132" rx="11" fill="url(#cardGold)"/>
      <text y="16" font-size="44" fill="#0a1018" stroke="none">±1</text>
    </g>
    <g transform="translate(444 172) rotate(10)">
      <rect x="-40" y="-58" width="80" height="116" rx="10" fill="url(#cardRed)"/>
      <text y="14" font-size="40" fill="#0a1018" stroke="none">−2</text>
    </g>
  </g>
  <!-- glow pools under the cards -->
  <g filter="url(#glow)" opacity="0.6">
    <ellipse cx="200" cy="262" rx="44" ry="8" fill="#3ea6ff"/>
    <ellipse cx="320" cy="252" rx="52" ry="9" fill="#f0b43c"/>
    <ellipse cx="440" cy="262" rx="44" ry="8" fill="#e35151"/>
  </g>
  <!-- the total: twenty -->
  <g transform="translate(320 330)" filter="url(#glow)">
    <rect x="-56" y="-26" width="112" height="52" rx="10" fill="#0a1a28" stroke="#f0b43c" stroke-width="3"/>
    <text y="15" font-family="Verdana, sans-serif" font-weight="700" font-size="36" text-anchor="middle" fill="#f0b43c">20</text>
  </g>
</svg>
