<text x="212.4" y="644" font-size="13" fill="#1a1220">Power</text>
<text x="40" y="686" font-size="13" fill="#5a5060">The LEDs take 5 V from their own supply (4 A), not from the Pico. Join that supply's ground to the Pico's, put 1000 µF across the strip's power,</text>
<text x="40" y="705" font-size="13" fill="#5a5060">and run the data line through the 74AHCT125 (powered from the 5 V supply) so the strip sees 5 V logic. The Pico itself runs from the PC's USB.</text>
