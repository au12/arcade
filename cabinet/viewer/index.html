<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>au12 Arcade: the cabinet in 3D</title>
<style>
  :root { color-scheme: dark; --bg: #1a1220; --ink: #f6eee6; --dim: #b8a9b8; --plasma: #ff8a24; --panel: rgba(38, 26, 46, 0.88); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .card { position: fixed; left: 20px; top: 20px; width: min(340px, calc(100% - 40px)); padding: 18px 20px; background: var(--panel); border: 1px solid rgba(255, 138, 36, 0.25); border-radius: 14px; backdrop-filter: blur(8px); }
  h1 { margin: 0 0 2px; font-size: 21px; letter-spacing: 0.02em; color: var(--plasma); font-weight: 800; }
  .sub { margin: 0 0 14px; color: var(--dim); font-size: 13.5px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0 0 16px; font-size: 13.5px; }
  dt { color: var(--dim); }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  label { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 14px; cursor: pointer; }
  input[type="range"] { flex: 1; accent-color: var(--plasma); }
  input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--plasma); }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button, .btn { appearance: none; border: 0; border-radius: 999px; padding: 8px 14px; font: 600 13.5px system-ui, sans-serif; background: var(--plasma); color: #24140a; cursor: pointer; text-decoration: none; }
  .btn.quiet { background: rgba(255, 255, 255, 0.1); color: var(--ink); }
  button:focus-visible, .btn:focus-visible, input:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #tip { position: fixed; pointer-events: none; padding: 7px 10px; background: rgba(15, 10, 18, 0.92); border-radius: 8px; font-size: 13px; max-width: 260px; }
  #tip b { display: block; color: var(--plasma); }
  #tip span { color: var(--dim); }
  .hint { position: fixed; right: 20px; bottom: 16px; color: var(--dim); font-size: 12.5px; }
  @media (max-width: 640px) { .card { top: auto; bottom: 12px; left: 12px; padding: 14px 16px; } .card dl { display: none; } .hint { display: none; } }
</style>
</head>
<body>
<canvas id="view" aria-label="A 3D model of the cabinet. Drag to turn it, scroll or pinch to zoom."></canvas>
<section class="card">
  <h1>au12 Arcade cabinet</h1>
  <p class="sub">Laser-cut bartop for the <span id="monitorName"></span>. Every part below is in the cut files.</p>
  <dl>
    <dt>Size</dt><dd id="size"></dd>
    <dt>Cut from</dt><dd id="sheets"></dd>
    <dt>Parts</dt><dd id="count"></dd>
  </dl>
  <label>Take it apart <input id="explode" type="range" min="0" max="100" value="0"></label>
  <label><input id="lights" type="checkbox" checked> Marquee lights</label>
  <label><input id="monitor" type="checkbox" checked> Monitor</label>
  <label><input id="layers" type="checkbox"> Show the two layers of each side</label>
  <div class="row">
    <button id="home" type="button" class="quiet btn">Reset the view</button>
    <a class="btn" href="https://github.com/au12/arcade/tree/main/cabinet">Cut files</a>
  </div>
</section>
<div id="tip" hidden></div>
<p class="hint">Drag to turn it, scroll to zoom, point at a part for its name.</p>
<script id="model" type="application/json">/*MODEL*/</script>
<script>/*SCRIPT*/</script>
</body>
</html>
