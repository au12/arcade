<style>

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .sub { margin: 0 0 14px; color: var(--dim); font-size: 13.5px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0 0 16px; font-size: 13.5px; }
  dt { color: var(--dim); }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  label { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 14px; cursor: pointer; }
  input[type="range"] { flex: 1; accent-color: var(--plasma); }
  input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--plasma); }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button, .btn { appearance: none; border: 0; border-radius: 999px; padding: 8px 14px; font: 600 13.5px system-ui, sans-serif; background: var(--plasma); color: #24140a; cursor: pointer; text-decoration: none; }
  .btn.quiet { background: rgba(255, 255, 255, 0.1); color: var(--ink); }
  button:focus-visible, .btn:focus-visible, input:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #tip { position: fixed; pointer-events: none; padding: 7px 10px; background: rgba(15, 10, 18, 0.92); border-radius: 8px; font-size: 13px; max-width: 260px; }
  #tip b { display: block; color: var(--plasma); }
  #tip span { color: var(--dim); }
  .hint { position: fixed; right: 20px; bottom: 16px; color: var(--dim); font-size: 12.5px; }
  @media (max-width: 640px) { .card { top: auto; bottom: 12px; left: 12px; padding: 14px 16px; } .card dl { display: none; } .hint { display: none; } }
</style>
