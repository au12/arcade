name: Build image

# Builds the arcade's image for amd64 and arm64 and publishes it to
# ghcr.io/<owner>/<repo>: latest from main, a version tag from releases.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - cabinet/**
      - controller/**
      - kiosk/**
      - '**.md'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version to tag the image with (set by the Release workflow)
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ (inputs.version || '') == '' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.version }},enable=${{ (inputs.version || '') != '' }}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
